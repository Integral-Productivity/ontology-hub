name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  router-and-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Built Worker is valid JavaScript
        run: python build.py > /tmp/ontology-router.js && node --check /tmp/ontology-router.js
      - name: Routing and content-negotiation tests
        run: node --test tests/*.test.mjs
      - name: Landing page builds and lists every registered prefix
        run: |
          python build_site.py site
          python - <<'PY'
          import json
          r = json.load(open("registry.json"))
          page = open("site/index.html", encoding="utf-8").read()
          missing = [p for p in r["prefixes"] if f'href="{p}"' not in page]
          assert not missing, f"landing page is missing {missing}"
          print("landing page lists", list(r["prefixes"]))
          PY
