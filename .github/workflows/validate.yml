name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  router-and-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Built Worker is valid JavaScript
        run: python build.py > /tmp/ontology-router.js && node --check /tmp/ontology-router.js
      - name: Routing and content-negotiation tests
        run: node --test tests/*.test.mjs
      - name: Landing page lists every released prefix and hides unreleased ones
        run: |
          python build_site.py site
          python - <<'PY'
          import json
          r = json.load(open("registry.json"))
          page = open("site/index.html", encoding="utf-8").read()
          listed = [p for p, c in r["prefixes"].items() if c.get("listed", True)]
          hidden = [p for p in r["prefixes"] if p not in listed]
          missing = [p for p in listed if f'href="{p}"' not in page]
          leaked = [p for p in hidden if f'href="{p}"' in page]
          assert not missing, f"landing page is missing {missing}"
          assert not leaked, f"landing page lists unreleased {leaked}"
          print("landing page lists", listed, "hides", hidden)
          PY
