name: smoke

# The acceptance list from metawork-ontology#1, run against the live domain
# from a GitHub runner (outside the Cloudflare account). Daily, on demand, and
# on every PR so a reviewer sees the live state next to the change.

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python smoke.py
