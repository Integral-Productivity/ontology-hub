name: smoke

# The acceptance list from metawork-ontology#1, run against the live domain
# from a GitHub runner (outside the Cloudflare account). Daily, on demand, and
# on every PR so a reviewer sees the live state next to the change.

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python smoke.py
